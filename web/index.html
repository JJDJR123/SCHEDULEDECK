<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="url(#lg)"/>
          <defs><linearGradient id="lg" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6D6AF8"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient></defs>
          <path d="M9 16.5l4.4 4.4L23 10.5" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-text"><b>日程舱</b><span>SCHEDULEDECK</span></div>
    </div>

    <div class="sidebar-body">
      <nav class="nav" id="nav"></nav>
      <div class="side-block" id="sideSource"></div>
      <div class="side-block" id="sideTags"></div>
    </div>

    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="page-title">
        <h1 id="pageTitle">任务</h1>
        <p id="pageSub">载入中…</p>
      </div>
      <div class="top-actions">
        <label class="search" for="searchInput">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="searchInput" type="search" placeholder="搜索任务 / 标签 / 备注" autocomplete="off" spellcheck="false" />
          <kbd>Ctrl K</kbd>
        </label>
        <button class="btn icon-only ghost" id="btnRefresh" title="立即同步飞书表格" aria-label="同步">
          <svg class="i"><use href="#i-refresh"/></svg>
        </button>
        <button class="btn icon-only ghost" id="btnBell" title="提醒中心" aria-label="提醒中心">
          <svg class="i"><use href="#i-bell"/></svg>
          <span class="ping" id="bellDot" hidden></span>
        </button>
        <button class="btn icon-only ghost" id="btnSettings" title="设置" aria-label="设置">
          <svg class="i"><use href="#i-settings"/></svg>
        </button>
        <button class="btn primary" id="btnImport">
          <svg class="i"><use href="#i-plus"/></svg><span>导入表格</span>
        </button>
      </div>
    </header>

    <div class="view-root" id="viewRoot"></div>
  </main>
</div>

<div class="layer-root" id="layerRoot"></div>
<div class="toasts" id="toastRoot" aria-live="polite"></div>
